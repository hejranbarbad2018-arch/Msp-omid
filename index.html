<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د صرافۍ سیستم - Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
    radial-gradient(
        circle at top left,
        rgba(40,190,120,.25),
        transparent 35%
    ),
    radial-gradient(
        circle at bottom right,
        rgba(0,70,45,.45),
        transparent 40%
    ),
    linear-gradient(
        135deg,
        #061b13,
        #0b3927,
        #126b43
    );

    background-attachment:fixed;
}


.login-box{

    width:400px;

    max-width:100%;

    padding:35px 30px;

    background:rgba(255,255,255,.96);

    border:1px solid rgba(255,255,255,.4);

    border-radius:24px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.45);

    text-align:center;
}


.logo{

    width:80px;

    height:80px;

    margin:0 auto 15px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        135deg,
        #126b43,
        #20a464
    );

    color:white;

    font-size:42px;

    box-shadow:
    0 10px 25px rgba(18,107,67,.35);
}


.title{

    color:#126b43;

    font-size:25px;

    font-weight:bold;

    margin-bottom:8px;
}


.subtitle{

    color:#777;

    font-size:14px;

    margin-bottom:25px;
}


.form-group{

    margin-bottom:16px;

    text-align:right;
}


.form-group label{

    display:block;

    margin-bottom:6px;

    color:#333;

    font-weight:bold;

    font-size:14px;
}


.form-group input{

    width:100%;

    height:48px;

    padding:0 14px;

    border:1px solid #d0d0d0;

    border-radius:10px;

    outline:none;

    font-size:16px;

    direction:ltr;

    text-align:left;

    background:#fff;

}


.form-group input:focus{

    border-color:#126b43;

    box-shadow:
    0 0 0 3px rgba(18,107,67,.12);
}


.login-button{

    width:100%;

    height:50px;

    margin-top:8px;

    border:none;

    border-radius:10px;

    background:
    linear-gradient(
        135deg,
        #126b43,
        #20a464
    );

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 8px 20px rgba(18,107,67,.3);

    transition:.2s;
}


.login-button:hover{

    transform:translateY(-1px);

}


.login-button:active{

    transform:scale(.98);

}


.error{

    display:none;

    margin-top:15px;

    padding:11px;

    border-radius:9px;

    background:#fdeaea;

    color:#c0392b;

    font-size:14px;

    font-weight:bold;
}


.footer{

    margin-top:25px;

    color:#999;

    font-size:12px;
}

</style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        💱
    </div>


    <div class="title">
        د صرافۍ مدیریت سیستم
    </div>


    <div class="subtitle">
        Login
    </div>


    <form id="loginForm">


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                id="username"
                type="text"
                placeholder="Username"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button"
        >
            🔐 Login
        </button>


        <div
            id="error"
            class="error"
        >
            ❌ Username یا Password غلط دی
        </div>


    </form>


    <div class="footer">
        Exchange Management System
    </div>


</div>



<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    /*
    ثابت Login معلومات
    */

    if(
        username === "admin" &&
        password === "102030"
    ){

        /*
        Login کامیاب
        */

        sessionStorage.setItem(
            "loggedIn",
            "yes"
        );


        /*
        خپل پخواني Dashboard ته ځي
        */

        window.location.href =
            "dashboard.html";


    }else{

        /*
        Login غلط
        */

        document
        .getElementById("error")
        .style.display = "block";


        document
        .getElementById("password")
        .value = "";


        document
        .getElementById("password")
        .focus();

    }

});

</script>

</body>

</html>
