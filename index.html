<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>د صرافۍ مدیریت سیستم</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    radial-gradient(circle at top left,rgba(32,164,100,.35),transparent 35%),
    radial-gradient(circle at bottom right,rgba(0,80,50,.55),transparent 40%),
    linear-gradient(135deg,#041a11,#0b3927,#126b43);
}

.login-box{
    width:400px;
    max-width:100%;
    background:rgba(255,255,255,.97);
    padding:35px 30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.logo{
    width:85px;
    height:85px;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(135deg,#126b43,#20a464);
    color:white;
    font-size:45px;
    box-shadow:0 10px 30px rgba(18,107,67,.35);
}

.title{
    color:#126b43;
    font-size:25px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

label{
    display:block;
    text-align:right;
    font-weight:bold;
    margin-bottom:6px;
    color:#333;
}

input{
    width:100%;
    height:50px;
    padding:0 14px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
    font-size:16px;
    direction:ltr;
    text-align:left;
}

input:focus{
    border-color:#126b43;
    box-shadow:0 0 0 3px rgba(18,107,67,.12);
}

button{
    width:100%;
    height:50px;
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,#126b43,#20a464);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(18,107,67,.3);
}

button:active{
    transform:scale(.98);
}

#error{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#fdeaea;
    color:#c0392b;
    font-weight:bold;
    font-size:14px;
}

.footer{
    margin-top:25px;
    color:#999;
    font-size:12px;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">💱</div>

    <div class="title">
        د صرافۍ مدیریت سیستم
    </div>

    <div class="subtitle">
        Login
    </div>

    <form onsubmit="login(event)">

        <label>
            Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="Username"
            required
        >

        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

        <div id="error">
            ❌ Username یا Password غلط دی
        </div>

    </form>

    <div class="footer">
        Exchange Management System
    </div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ggblghhfngmshmmkwnsl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_7u9V---1ywtKp9EK9yZhIA_F8vIzCJK";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* که مخکې Login شوی وي، مستقیم Dashboard ته ځي */
async function checkExistingSession(){

    const {data} =
    await db.auth.getSession();

    if(data.session){
        window.location.href="dashboard.html";
    }
}


/* LOGIN */
async function login(event){

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const errorBox =
        document.getElementById("error");

    errorBox.style.display="none";

    /*
      Supabase Auth Email/Password استعمالوي.
      هغه Email داخل کړه چې User دې پرې جوړ کړی.
    */

    const {data,error} =
    await db.auth.signInWithPassword({
        email:username,
        password:password
    });

    if(error){

        errorBox.textContent =
        "❌ Email یا Password غلط دی";

        errorBox.style.display="block";

        document.getElementById("password").value="";

        return;
    }

    if(data.session){

        sessionStorage.setItem(
            "loggedIn",
            "yes"
        );

        window.location.href="dashboard.html";
    }
}


checkExistingSession();

</script>

</body>
</html>
