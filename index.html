<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>د صرافۍ سیستم - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    radial-gradient(circle at top left,#20a46455,transparent 35%),
    radial-gradient(circle at bottom right,#0b3d2b99,transparent 40%),
    linear-gradient(135deg,#041a11,#0b3927,#126b43);
}

.login-box{
    width:400px;
    max-width:100%;
    padding:35px 28px;
    background:#ffffffee;
    border-radius:24px;
    box-shadow:0 20px 70px #0008;
    text-align:center;
}

.logo{
    font-size:60px;
    margin-bottom:8px;
}

.title{
    font-size:25px;
    color:#126b43;
    font-weight:bold;
}

.sub{
    color:#777;
    margin:8px 0 25px;
}

label{
    display:block;
    text-align:right;
    font-weight:bold;
    margin-top:12px;
}

input{
    width:100%;
    padding:13px;
    margin-top:6px;
    border:1px solid #ccc;
    border-radius:9px;
    outline:none;
}

input:focus{
    border-color:#126b43;
}

.btn{
    width:100%;
    padding:13px;
    margin-top:20px;
    border:0;
    border-radius:9px;
    background:#126b43;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.btn:hover{
    background:#20a464;
}

.error{
    display:none;
    color:#c0392b;
    margin-top:12px;
    font-weight:bold;
}

.footer{
    margin-top:20px;
    color:#999;
    font-size:12px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">💱</div>

    <div class="title">
        د صرافۍ مدیریت سیستم
    </div>

    <div class="sub">
        Login
    </div>

    <form onsubmit="login(event)">

        <label>Username</label>
        <input
            id="username"
            type="text"
            autocomplete="username"
            required
        >

        <label>Password</label>
        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button class="btn" type="submit">
            🔐 Login
        </button>

        <div class="error" id="error">
            ❌ Username یا Password غلط دی
        </div>

    </form>

    <div class="footer">
        Exchange Management System
    </div>

</div>

<script>

/* ================================
   LOGIN PASSWORD
================================ */

const DEFAULT_LOGIN_PASSWORD = "102030";

const PASSWORD_KEY = "loginPassword";

const PASSWORD_VERSION = "4";

const VERSION_KEY = "passwordVersion";


/*
   لومړی ځل Login Password = 102030
*/
if(
    localStorage.getItem(VERSION_KEY) !== PASSWORD_VERSION
){

    localStorage.setItem(
        PASSWORD_KEY,
        DEFAULT_LOGIN_PASSWORD
    );

    localStorage.setItem(
        VERSION_KEY,
        PASSWORD_VERSION
    );
}


/* ================================
   LOGIN
================================ */

function login(event){

    event.preventDefault();

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const savedPassword =
        localStorage.getItem(PASSWORD_KEY)
        || DEFAULT_LOGIN_PASSWORD;


    if(
        username === "admin" &&
        password === savedPassword
    ){

        sessionStorage.setItem(
            "loggedIn",
            "yes"
        );

        window.location.href =
            "dashboard.html";

    }else{

        document
        .getElementById("error")
        .style.display="block";

    }

}

</script>

</body>
</html>
