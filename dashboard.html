function money(n){

    return Number(n || 0)
    .toLocaleString("en-US",{
        maximumFractionDigits:2
    });

}


function escapeHtml(v){

    return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function balanceTemplate(){

function formatTime(date){

    return new Date(date)
    .toLocaleTimeString(
        "en-GB",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function formatDate(date){

    return new Date(date)
    .toLocaleDateString("en-GB");

}


/* =====================================================
   DESCRIPTION / EXCHANGE MARKER
===================================================== */

function makeExchangeMarker(id){

    return "[EX:"+id+"]";

}


function getExchangeId(description){

    const m =
    String(description || "")
    .match(/\[EX:([^\]]+)\]/);

    return m ? m[1] : null;

}


function cleanDescription(description){

    return String(description || "")
    .replace(/\[EX:[^\]]+\]\s*/,"")
    .trim();

}

/* =====================================================

function updateDashboard(){

    const tc =
    document.getElementById(
        "totalCustomers"
    );

    const tt =
    document.getElementById(
        "totalTransactions"
    );

    const td =
    document.getElementById(
        "totalDeposits"
    );

    const tw =
    document.getElementById(
        "totalWithdraws"
    );


    if(tc)
        tc.textContent =
        customers.length;


    if(tt)
        tt.textContent =
        transactions.length;


    let deposits=0;
    let withdraws=0;


    transactions.forEach(t=>{

        if(t.type==="deposit")
            deposits +=
            Math.abs(
                Number(t.amount)||0
            );


        if(t.type==="withdraw")
            withdraws +=
            Math.abs(
                Number(t.amount)||0
            );

    });


    if(td)
        td.textContent =
        money(deposits);


    if(tw)
        tw.textContent =
        money(withdraws);

}


/* =====================================================
   CUSTOMER BALANCE
===================================================== */

function getCustomerBalances(customerId){

    const balance =
    balanceTemplate();


    transactions
    .filter(t=>
        String(t.customer_id) ===
        String(customerId)
    )
    .sort(
        (a,b)=>
        new Date(a.created_at) -
        new Date(b.created_at)
    )
    .forEach(t=>{

        if(
            balance[t.currency] !== undefined
        ){

            balance[t.currency] +=
            Number(t.amount)||0;

        }

    });


    return balance;

}

function getRate(from,to){

    if(from===to)
        return 1;


    return Number(
        exchangeRates?.[from]?.[to] || 0
    );

}


function loadExchangeRate(){

    const from =
    fromCurrency.value;

    const to =
    toCurrency.value;


    const rate =
    getRate(from,to);


    exchangeRate.value =
    rate || "";


    calculateExchange();

}


function calculateExchange(){

    const amount =
    Number(exchangeAmount.value);


    const rate =
    Number(exchangeRate.value);


    receivedAmount.value =
    (
        amount>0 &&
        rate>0
    )
    ?
    money(amount*rate)
    :
    "";

}


async function exchangeMoney(){

    const account =
    exchangeAccount.value.trim();


    const from =
    fromCurrency.value;


    const to =
    toCurrency.value;


    const amount =
    Number(exchangeAmount.value);


    const rate =
    getRate(from,to);


    const description =
    exchangeDescription.value.trim();


    const c =
    customers.find(
        x=>
        x.account_number===account
    );


    if(
        !account ||
        !amount ||
        amount<=0
    ){

        alert(
            "Account او Amount صحیح داخل کړئ."
        );

        return;

    }


    if(from===to){

        alert(
            "From او To باید مختلف وي."
        );

        return;

    }


    if(!rate || rate<=0){

        alert(
            "د دې Currency Pair لپاره Exchange Rate مشخص شوی نه دی."
        );

        return;

    }


    if(!description){

        alert(
            "Narration / Description ضروري دی."
        );

        return;

    }


    if(!c){

        alert(
            "Customer پیدا نه شو."
        );

        return;

    }


    const balance =
    getCustomerBalances(c.id);


    if(
        (balance[from]||0)<amount
    ){

        alert(
            "❌ Source Balance کافي نه دی."
        );

        return;

    }


    askPassword(async()=>{

        const received =
        amount*rate;


        const exchangeId =
        crypto.randomUUID
        ?
        crypto.randomUUID()
        :
        Date.now().toString(36)+
        Math.random().toString(36).slice(2);


        const time =
        new Date().toISOString();


        const sourceBalance =
        (balance[from]||0)-amount;


        const targetBalance =
        (balance[to]||0)+received;


        const marker =
        makeExchangeMarker(exchangeId);


        /* SOURCE */

        const {error:e1} =
        await db
        .from("transactions")
        .insert({

            customer_id:c.id,

            currency:from,

            amount:-amount,

            balance:sourceBalance,

            description:
            marker+" "+description+
            " | Exchange → "+to,

            type:"exchange",

            created_at:time

        });


        if(e1){

            alert(
                "Exchange لومړۍ برخه ثبت نه شوه:\n\n"+
                e1.message
            );

            return;

        }


        /* TARGET */

        const {error:e2} =
        await db
        .from("transactions")
        .insert({

            customer_id:c.id,

            currency:to,

            amount:received,

            balance:targetBalance,

            description:
            marker+" "+description+
            " | Exchange ← "+from,

            type:"exchange",

            created_at:time

        });


        if(e2){

            /*
             If second side fails,
             delete first side.
            */

            await db
            .from("transactions")
            .delete()
            .eq("customer_id",c.id)
            .eq("created_at",time);


            alert(
                "Exchange دوهمه برخه ثبت نه شوه:\n\n"+
                e2.message
            );

            return;

        }


        await refreshData();

        closeModal("exchangeModal");


        alert(
            "Exchange په بریالیتوب سره ثبت شو."
        );

    });

}

    if(
        !t ||
        !amount ||
        amount<=0 ||
        !description
    ){

        alert(
            "Amount او Description صحیح داخل کړئ."
        );

        return;

    }


    /*
       Preserve exchange marker
    */

    const exchangeId =
    getExchangeId(t.description);


    if(exchangeId){

        description =
        makeExchangeMarker(exchangeId)
        +" "+description;

    }


    const newAmount =
    Number(t.amount)<0
    ? -amount
    : amount;


    const {error} =
    await db
    .from("transactions")
    .update({

        amount:newAmount,

        description:description

    })
    .eq("id",id);


    if(error){

        alert(
            "Transaction Update نه شو:\n\n"+
            error.message
        );

        return;

    }


    await refreshData();


    await recalculateCustomerBalances(
        t.customer_id
    );


    await refreshData();


    closeModal(
        "editTransactionModal"
    );


    alert(
        "Transaction Update شو."
    );

}


/* =====================================================
   RECALCULATE BALANCES IN SUPABASE
===================================================== */

async function recalculateCustomerBalances(customerId){

    const list =
    transactions
    .filter(
        t=>
        String(t.customer_id)===
        String(customerId)
    )
    .sort(
        (a,b)=>
        new Date(a.created_at)-
        new Date(b.created_at)
    );


    const balance =
    balanceTemplate();


    for(const t of list){

        if(
            balance[t.currency]===undefined
        )
        continue;


        balance[t.currency]+=
        Number(t.amount)||0;


        const {error} =
        await db
        .from("transactions")
        .update({

            balance:
            balance[t.currency]

        })
        .eq("id",t.id);


        if(error)
            console.error(error);

    }

}


/* =====================================================
   DELETE TRANSACTION
===================================================== */

function deleteTransaction(id){

    askPassword(async()=>{

        const t =
        transactions.find(
            x=>x.id===id
        );


        if(!t)
            return;


        const exchangeId =
        getExchangeId(
            t.description
        );


        if(
            exchangeId &&
            t.type==="exchange"
        ){

            if(
                !confirm(
                    "دا Exchange معامله دواړه برخې لري؛ دواړه به حذف شي. دوام ورکړو؟"
                )
            )
            return;


            const ids =
            transactions
            .filter(x=>
                x.type==="exchange" &&
                getExchangeId(
                    x.description
                )===exchangeId
            )
            .map(x=>x.id);


            if(ids.length){

                const {error} =
                await db
                .from("transactions")
                .delete()
                .in("id",ids);


                if(error){

                    alert(
                        "Exchange حذف نه شو:\n\n"+
                        error.message
                    );

                    return;

                }

            }

        }

        else{

            if(
                !confirm(
                    "ایا دا Transaction حذف کړئ؟"
                )
            )
            return;


            const {error} =
            await db
            .from("transactions")
            .delete()
            .eq("id",id);


            if(error){

                alert(
                    "Transaction حذف نه شو:\n\n"+
                    error.message
                );

                return;

            }

        }


        await loadTransactions();


        await recalculateCustomerBalances(
            t.customer_id
        );


        await refreshData();


        if(historyAccount.value)
            showCustomerHistory();


        alert(
            "Transaction حذف شو او Balance بیا حساب شو."
        );

    });

}


/* =====================================================
   GENERAL REPORT
===================================================== */

function openReports(){

    const totals =
    balanceTemplate();


    customers.forEach(c=>{

        const b =
        getCustomerBalances(c.id);


        totals.AFN +=
        Number(b.AFN)||0;


        totals.USD +=
        Number(b.USD)||0;


        totals.PKR +=
        Number(b.PKR)||0;


        totals.IRR +=
        Number(b.IRR)||0;

    });


    let deposit=0;

    let withdraw=0;


    transactions.forEach(t=>{

        if(t.type==="deposit")
            deposit +=
            Math.abs(
                Number(t.amount)||0
            );


        if(t.type==="withdraw")
            withdraw +=
            Math.abs(
                Number(t.amount)||0
            );

    });


    reportUSD.textContent =
    money(totals.USD);


    reportAFN.textContent =
    money(totals.AFN);


    reportPKR.textContent =
    money(totals.PKR);


    reportIRR.textContent =
    money(totals.IRR);


    reportDeposit.textContent =
    money(deposit);


    reportWithdraw.textContent =
    money(withdraw);


    reportTransactions.textContent =
    transactions.length;


    reportTable.innerHTML=

    [...transactions]
    .sort(
        (a,b)=>
        new Date(b.created_at)-
        new Date(a.created_at)
    )
    .map(t=>{

        const c =
        customers.find(
            x=>x.id===t.customer_id
        );


        return `

        <tr>

        <td>
        ${escapeHtml(
            c?.account_number || ""
        )}
        </td>

        <td>
        ${escapeHtml(
            c?.name || ""
        )}
        </td>

        <td>
        ${escapeHtml(t.type)}
        </td>

        <td>
        ${escapeHtml(t.currency)}
        </td>

        <td class="${
            Number(t.amount)>=0
            ? "positive"
            : "negative"
        }">

        ${
            Number(t.amount)>=0
            ? "+"
            : ""
        }

        ${money(t.amount)}

        </td>

        <td>
        ${escapeHtml(
            cleanDescription(
                t.description
            )
        )}
        </td>

        <td>
        ${escapeHtml(
            formatDate(t.created_at)
        )}
        </td>

        </tr>

        `;

    }).join("")

    ||

    `<tr>
    <td colspan="7">
    هیڅ معلومات نشته.
    </td>
    </tr>`;


    openModal("reportsModal");

}

    exchangeRates.USD.IRR || "";

    exchangeRates.AFN.PKR || "";

    exchangeRates.AFN.IRR || "";


    ratePKR_IRR.value =
    exchangeRates.PKR.IRR || "";


    openModal("ratesModal");

}


function saveRates(){

    const uA =
    Number(rateUSD_AFN.value);


    const uP =
    Number(rateUSD_PKR.value);


    const uI =
    Number(rateUSD_IRR.value);


    const aP =
    Number(rateAFN_PKR.value);


    const aI =
    Number(rateAFN_IRR.value);


    const pI =
    Number(ratePKR_IRR.value);


    if(
        !uA ||
        !uP ||
        !uI ||
        !aP ||
        !aI ||
        !pI
    ){

        alert(
            "ټول Rates داخل کړئ."
        );

        return;

    }


    exchangeRates={

        USD:{
            AFN:uA,
            PKR:uP,
            IRR:uI
        },

        AFN:{
            USD:1/uA,
            PKR:aP,
            IRR:aI
        },

        PKR:{
            USD:1/uP,
            AFN:1/aP,
            IRR:pI
        },

        IRR:{
            USD:1/uI,
            AFN:1/aI,
            PKR:1/pI
        }

    };


    localStorage.setItem(
        "exchangeRates",
        JSON.stringify(exchangeRates)
    );


    closeModal("ratesModal");


    alert(
        "Exchange Rates Save شول."
    );

}
